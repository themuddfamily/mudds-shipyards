name: Game regression
on:
  pull_request:
  push:
    branches: [main, master]
    # Checkpoint status updates must not cancel the tested runtime commit.
    # Pull requests and every other changed path still run the full CI roster.
    paths-ignore:
      - 'ROADMAP.md'
      - 'docs/WINDOWS_INSTALLER.md'
  workflow_dispatch:
    inputs:
      full_candidate:
        description: 'Run full candidate gate (RENDER-001 accepted; raw warnings retained)'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '23 3 * * 1,4'
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
env:
  GODOT_VERSION: 4.7.1
  GODOT_SILENCE_ROOT_WARNING: '1'
  TEST_MATRIX_AUDIO_DRIVER: Dummy
  TEST_MATRIX_JOBS: '1'
  # Each Godot worker owns a pool; ENet suites also use fixed loopback ports.
  # Keep hosted CI serial; local parallel runs serialize the network lane.
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install release fixture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis shellcheck
      - name: Release tools and runner fixtures
        run: |
          python3 -m unittest discover -s tools/release -p 'test_*.py'
          bash tools/release/test_run_test_matrix_canonical.sh
          shellcheck tools/release/run_test_matrix.sh tools/release/run_matrix.sh tools/release/install_ci_godot.sh
      - name: Install pinned Godot
        run: bash tools/release/install_ci_godot.sh
      - name: Core gameplay regression
        run: >-
          bash tools/release/run_test_matrix.sh --audio-driver Dummy --jobs 1
          --scope smoke_test,sandbox_loop_test,ship_command_test,landing_assist_accessibility_test,flight_input_test,control_mapping_test,crash_recovery_coordinator_test,tests/world/ember_surface_loop_return_persistence_test.gd
          --timeout 180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-regression
          path: artifacts/test-matrix/
          retention-days: 7
  broad:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [headless, graphical]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: bash tools/release/install_ci_godot.sh
      - name: Install software rendering display
        if: matrix.mode == 'graphical'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      # Real Ember walking and 20 km ascent needs up to 1200 seconds on slow
      # software/CI hosts. Keep core suites at 180 seconds; preserve real physics.
      # These mode-filtered jobs are regressions, not a full-scope release gate.
      # Full release evidence requires one unfiltered --mode all run with display.
      - name: Broader headless suites
        if: matrix.mode == 'headless'
        run: bash tools/release/run_test_matrix.sh --mode headless --audio-driver Dummy --jobs 1 --timeout 1200
      # bugs.md RENDER-001 remains accepted, not fixed; preserve/report raw warnings.
      - name: Graphical suites with Forward+ software rendering
        if: matrix.mode == 'graphical'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: xvfb-run -a -s '-screen 0 2560x1440x24' bash tools/release/run_test_matrix.sh --mode graphical --display-driver x11 --accepted-risk RENDER-001 --audio-driver Dummy --jobs 1 --timeout 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: broad-${{ matrix.mode }}-regression
          path: artifacts/test-matrix/
          retention-days: 14
  full-candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.full_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Retain exact candidate source
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p artifacts/full-candidate-source
          git rev-parse HEAD > artifacts/full-candidate-source/commit.txt
          git archive --format=tar.gz HEAD > artifacts/full-candidate-source/source.tar.gz
          sha256sum artifacts/full-candidate-source/source.tar.gz > artifacts/full-candidate-source/source.sha256
      - name: Install pinned Godot
        run: bash tools/release/install_ci_godot.sh
      - name: Install software rendering display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers
      # One unfiltered run preserves the broad jobs' 1200s headless / 300s
      # graphical limits; longer source-declared suite budgets still apply.
      # RENDER-001 is explicitly accepted, not fixed; raw warnings are retained.
      # Leave time after the step timeout to upload even incomplete/failing runs.
      - name: Full final-source regression with Forward+ software rendering
        timeout-minutes: 330
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
          TEST_MATRIX_RUN_ID: full-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          xvfb-run -a -s '-screen 0 2560x1440x24' \
            bash tools/release/run_test_matrix.sh --mode all --jobs 1 \
            --display-driver x11 --audio-driver Dummy --accepted-risk RENDER-001 \
            --timeout 300 --headless-timeout 1200
          # The serial runner reports cache drift without failing; this full gate
          # requires a complete, unfiltered, source-stable AND cache-stable run.
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifests = list(Path('artifacts/test-matrix').glob('*/run-manifest.txt'))
          expected = Path('artifacts/test-matrix') / os.environ['TEST_MATRIX_RUN_ID'] / 'run-manifest.txt'
          if manifests != [expected]:
              raise SystemExit('Full candidate requires exactly its own completed run manifest')
          fields = {}
          for line in expected.read_text().splitlines():
              key, separator, value = line.partition('=')
              if not separator or key in fields:
                  raise SystemExit('Malformed or duplicate full-candidate manifest field')
              fields[key] = value
          required = {'overall_status': 'PASS', 'execution_mode': 'all', 'scope_specs': 'all',
                      'mode_excluded_suite_count': '0', 'jobs_effective': '1',
                      'failed_suite_count': '0',
                      'source_manifest_match': 'true', 'godot_cache_stable': 'true'}
          if any(fields.get(key) != value for key, value in required.items()):
              raise SystemExit('Full candidate completion, scope, source or cache gate failed')
          total = fields.get('total_suites', '')
          if not total.isdigit() or int(total) < 1 or fields.get('discovered_suite_count') != total:
              raise SystemExit('Full candidate did not complete the entire discovered roster')
          if not fields.get('run_completed_utc') or fields.get('run_id') != os.environ['TEST_MATRIX_RUN_ID']:
              raise SystemExit('Full candidate completion identity is missing or incorrect')
          print('Full candidate complete scope, source and strict cache gates: PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/test-matrix/
            artifacts/full-candidate-source/
          retention-days: 30
          if-no-files-found: error
  ember-completed-return:
    if: github.event_name == 'workflow_dispatch' && inputs.full_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: bash tools/release/install_ci_godot.sh
      # The canonical soak is not named *_test.gd and is outside discovery.
      # Keep its 3600s physical route cap separate from the matrix suite caps.
      - name: Cold import and canonical Ember completed return
        timeout-minutes: 72
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          logs=artifacts/ember-completed-return
          mkdir -p "$logs"
          git rev-parse HEAD > "$logs/commit.txt"
          test "$(cat "$logs/commit.txt")" = "$CANDIDATE_SHA"
          test ! -d .godot
          profile="$(mktemp -d "$RUNNER_TEMP/ember-completed-return.XXXXXX")"
          export XDG_DATA_HOME="$profile/data" XDG_CONFIG_HOME="$profile/config"
          export XDG_CACHE_HOME="$profile/cache" XDG_RUNTIME_DIR="$profile/runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          diagnostic_re='^[[:space:]]*SCRIPT[[:space:]]+ERROR|^[[:space:]]*ERROR:|\bFATAL ERROR\b|\bObjectDB\b|Resource.*still in use|\bOrphaned\b|\bLeaked\b|^[[:space:]]*FAIL:'
          import_exit=0
          timeout --kill-after=10s 600s godot --headless --audio-driver Dummy \
            --editor --path . --quit > "$logs/import.log" 2>&1 || import_exit=$?
          printf '%s\n' "$import_exit" > "$logs/import-exit.txt"
          cat "$logs/import.log"
          test "$import_exit" -eq 0
          if grep -E "$diagnostic_re" "$logs/import.log"; then
            exit 1
          fi
          route_exit=0
          timeout --kill-after=10s 3600s godot --headless --audio-driver Dummy \
            --path . --script res://tests/ember_transit_movement_soak.gd \
            -- --ember-completed-return > "$logs/route.log" 2>&1 || route_exit=$?
          printf '%s\n' "$route_exit" > "$logs/route-exit.txt"
          cat "$logs/route.log"
          test "$route_exit" -eq 0
          if grep -E "$diagnostic_re" "$logs/route.log"; then
            exit 1
          fi
          assessment="$(python3 tools/release/test_suite_catalog.py --assess \
            tests/ember_transit_movement_soak.gd "$logs/route.log")"
          printf '%s\n' "$assessment" > "$logs/completion.txt"
          test "$assessment" = $'EMBER_TRANSIT_MOVEMENT_TEST_OK\t1\tEMBER_TRANSIT_MOVEMENT_TEST_OK\t52'
          grep -Fxq 'EMBER_TRANSIT_MOVEMENT_TEST_OK: 52 assertions' "$logs/route.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ember-completed-return-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ember-completed-return/
          retention-days: 30
          if-no-files-found: error
